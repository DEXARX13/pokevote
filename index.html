<title>PokéVote — Vote pour ton Pokémon préféré</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1b2030;
    color: #e9ecf4;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, system-ui, sans-serif;
    padding-bottom: 48px;
  }
  /* ── Boîtier Pokédex ── */
  .dex {
    background: linear-gradient(180deg, #c9302b, #a02420);
    border-bottom: 6px solid #6e1714;
    padding: 20px 24px 24px;
    border-radius: 0 0 22px 22px;
    max-width: 860px;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .dex-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .lens {
    width: 44px; height: 44px; border-radius: 50%;
    background: #eef4ff; border: 3px solid #6e1714;
    display: grid; place-items: center;
  }
  .lens-inner {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9fd0ff, #2b6cb0 70%);
  }
  .leds { display: flex; gap: 8px; }
  .led { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
  h1 {
    font-size: 2.1rem; letter-spacing: .5px; color: #fff;
    text-shadow: 0 2px 0 #6e1714; margin-bottom: 4px;
  }
  .subtitle { color: #ffd9d7; font-size: .95rem; max-width: 520px; margin-bottom: 14px; }
  .screen {
    background: #1e2b1e; border: 3px solid #6e1714; border-radius: 10px;
    padding: 10px 14px; color: #9be89b;
    font-family: 'Courier New', monospace; font-size: .95rem;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
  }
  .banner {
    margin-top: 8px; color: #fff; background: #6e1714;
    padding: 8px 12px; border-radius: 8px; font-size: .85rem;
  }
  .banner a { color: #f5c542; }
  /* ── Navigation ── */
  nav {
    max-width: 860px; margin: 18px auto 10px; padding: 0 16px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tab {
    padding: 9px 18px; border-radius: 10px;
    border: 2px solid #39415a; background: #242b3f; color: #aeb6cf;
    font-weight: 700; font-size: .95rem; cursor: pointer; font-family: inherit;
  }
  .tab-on { background: #c9302b; border-color: #6e1714; color: #fff; }
  .shiny-on { background: #f5c542; border-color: #c9a227; color: #4a3400; }
  select, input[type="search"] {
    padding: 9px 12px; border-radius: 10px;
    border: 2px solid #39415a; background: #242b3f; color: #e9ecf4;
    font-size: .95rem; outline: none; font-family: inherit;
  }
  input[type="search"] { flex: 1; min-width: 180px; }
  .tab:focus-visible, .card:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid #f5c542; outline-offset: 2px;
  }
  /* ── Grille ── */
  #grid {
    max-width: 860px; margin: 0 auto; padding: 6px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 10px;
  }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 10px 6px 12px; background: #242b3f;
    border: 2px solid #39415a; border-radius: 14px;
    cursor: pointer; color: inherit; font-family: inherit; text-align: center;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover:not(:disabled) { transform: translateY(-2px); border-color: #c9302b; }
  .card:disabled { opacity: .7; cursor: wait; }
  .card-mine { border-color: #f5c542; background: #2c3350; }
  .card .num { font-size: .72rem; color: #8b93ad; }
  .card img { width: 72px; height: 72px; image-rendering: pixelated; margin: 2px auto; }
  .card .name { font-weight: 700; font-size: .85rem; line-height: 1.15; color: #f2f4fa; }
  .card .count { font-size: .75rem; color: #aeb6cf; margin-top: 2px; }
  .badge {
    position: absolute; top: 6px; right: 6px;
    background: #f5c542; color: #4a3400;
    font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 999px;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: #aeb6cf; padding: 30px 10px; }
  /* ── Classement ── */
  #ranking {
    max-width: 720px; margin: 0 auto; padding: 6px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .rank-row {
    display: flex; align-items: center; gap: 12px;
    background: #242b3f; border: 2px solid #39415a; border-radius: 14px;
    padding: 8px 14px 8px 8px;
  }
  .rank-row:first-child { border-color: #f5c542; }
  .rank-pos { width: 30px; text-align: center; font-weight: 800; font-size: 1.05rem; color: #f5c542; }
  .rank-row img { width: 52px; height: 52px; image-rendering: pixelated; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-id { font-weight: 400; color: #8b93ad; font-size: .8rem; }
  .bar-track { height: 8px; background: #1b2030; border-radius: 999px; margin-top: 5px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, #c9302b, #f5c542);
    border-radius: 999px; transition: width .4s ease;
  }
  .rank-count {
    font-weight: 800; min-width: 34px; text-align: right;
    color: #9be89b; font-family: 'Courier New', monospace;
  }
  footer { text-align: center; color: #69718c; font-size: .78rem; margin-top: 28px; padding: 0 16px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover, .bar-fill { transition: none; transform: none; }
  }
</style>
</head>

const GENS = [[1,151],[152,251],[252,386],[387,493],[494,649],[650,721],[722,809],[810,905],[906,1025]];
const genOf = sp => GENS.findIndex(([a, b]) => sp >= a && sp <= b) + 1;

// Entrées votables : base + formes, les formes juste après leur espèce
const ENTRIES = [
  ...POKEMON.map(p => ({ key: String(p.id), id: p.id, name: p.name, species: p.id, form: false })),
  ...FORMS.map(([id, name, sp]) => ({ key: String(id), id, name, species: sp, form: true })),
].sort((a, b) => a.species - b.species || a.id - b.id);
const byKey = {};
ENTRIES.forEach(e => { byKey[e.key] = e; });

const sprite  = (id, sh) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${sh ? "shiny/" : ""}${id}.png`;
const artwork = (id, sh) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${sh ? "shiny/" : ""}${id}.png`;

// Clé de vote : "25" = Pikachu, "s25" = Pikachu shiny, "10034" = Méga-Dracaufeu X…
const isShinyKey = k => k.charAt(0) === "s";
const entryOf = k => byKey[isShinyKey(k) ? k.slice(1) : k];
const labelOf = k => {
  const e = entryOf(k);
  return e ? e.name + (isShinyKey(k) ? " \u2728" : "") : "?";
};

// ─── État ───
let votes = {};
let myVote = localStorage.getItem("pokevote-my-vote") || null;
if (myVote && !entryOf(myVote)) myVote = null;
let shiny = false;
let saving = false;
let db = null;

const $ = id => document.getElementById(id);
const screen = $("screen"), banner = $("banner");
const grid = $("grid"), ranking = $("ranking");
const searchInput = $("search"), genSelect = $("gen-select"), shinyBtn = $("shiny-toggle");

// ─── Firebase ───
const configOk = firebaseConfig.apiKey && firebaseConfig.databaseURL;
if (configOk) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref("votes").on("value", snap => {
    votes = snap.val() || {};
    updateScreen();
    renderGrid();
    renderRanking();
  }, err => {
    showBanner("Impossible de lire les votes (v\u00e9rifie les r\u00e8gles de la base). " + err.message);
  });
} else {
  showBanner("Configuration Firebase manquante : les votes sont d\u00e9sactiv\u00e9s.");
  updateScreen();
}

function showBanner(msg) {
  banner.textContent = msg;
  banner.classList.remove("hidden");
}

async function voteFor(voteKey) {
  if (!db || saving || voteKey === myVote) return;
  saving = true;
  renderGrid();
  try {
    const old = myVote;
    if (old != null) {
      await db.ref("votes/" + old).transaction(c => Math.max(0, (c || 0) - 1));
    }
    await db.ref("votes/" + voteKey).transaction(c => (c || 0) + 1);
    myVote = voteKey;
    localStorage.setItem("pokevote-my-vote", voteKey);
  } catch (e) {
    showBanner("Le vote n'a pas pu \u00eatre enregistr\u00e9. R\u00e9essaie.");
  }
  saving = false;
  updateScreen();
  renderGrid();
  renderRanking();
}

// ─── Rendu ───
function totalVotes() {
  return Object.values(votes).reduce((a, b) => a + (b || 0), 0);
}

function updateScreen() {
  const t = totalVotes();
  const plural = t > 1 ? "s" : "";
  if (!configOk) {
    screen.textContent = "Mode hors ligne \u2014 votes d\u00e9sactiv\u00e9s";
  } else if (myVote) {
    screen.innerHTML = `Ton favori : <b>${escapeHtml(labelOf(myVote))}</b> \u00b7 ${t} vote${plural} au total`;
  } else {
    screen.textContent = `Aucun vote enregistr\u00e9 \u2014 choisis ton favori ! (${t} vote${plural} au total)`;
  }
}

function currentFilter() {
  const q = searchInput.value.trim().toLowerCase();
  const g = genSelect.value;
  return ENTRIES.filter(e => {
    if (g === "F") { if (!e.form) return false; }
    else if (g !== "0" && genOf(e.species) !== parseInt(g, 10)) return false;
    if (!q) return true;
    return (
      e.name.toLowerCase().includes(q) ||
      String(e.species) === q.replace(/^0+/, "") ||
      String(e.id) === q.replace(/^0+/, "")
    );
  });
}

function renderGrid() {
  const list = currentFilter();
  if (!list.length) {
    grid.innerHTML = `<p class="empty">Aucun Pok\u00e9mon ne correspond \u00e0 \u00ab ${escapeHtml(searchInput.value)} \u00bb. V\u00e9rifie l'orthographe ou essaie un num\u00e9ro (1 \u00e0 1025).</p>`;
    return;
  }
  grid.innerHTML = list.map(e => {
    const voteKey = (shiny ? "s" : "") + e.key;
    const c = votes[voteKey] || 0;
    const mine = voteKey === myVote;
    const label = e.name + (shiny ? " \u2728" : "");
    return `<button class="card${mine ? " card-mine" : ""}" data-key="${voteKey}" ${saving ? "disabled" : ""}
      title="${mine ? "Ton favori actuel" : "Voter pour " + escapeHtml(label)}">
      <span class="num">n\u00b0${String(e.species).padStart(3, "0")}${e.form ? " \u2022 forme" : ""}</span>
      <img src="${sprite(e.id, shiny)}" alt="${escapeHtml(label)}" loading="lazy"
           onerror="this.onerror=null;this.src='${artwork(e.id, shiny)}'">
      <span class="name">${escapeHtml(label)}</span>
      <span class="count">${c > 0 ? c + " vote" + (c > 1 ? "s" : "") : "\u2014"}</span>
      ${mine ? '<span class="badge">Ton favori</span>' : ""}
    </button>`;
  }).join("");
}

function renderRanking() {
  const rows = Object.entries(votes)
    .map(([k, count]) => ({ k, count: count || 0, e: entryOf(k) }))
    .filter(r => r.count > 0 && r.e)
    .sort((a, b) => b.count - a.count || a.e.species - b.e.species);
  if (!rows.length) {
    ranking.innerHTML = `<p class="empty">Personne n'a encore vot\u00e9. Sois le premier \u2014 va dans l'onglet \u00ab Voter \u00bb !</p>`;
    return;
  }
  const max = rows[0].count;
  ranking.innerHTML = rows.map((r, i) => {
    const sh = isShinyKey(r.k);
    return `<div class="rank-row">
      <span class="rank-pos">${i + 1}</span>
      <img src="${sprite(r.e.id, sh)}" alt="" onerror="this.onerror=null;this.src='${artwork(r.e.id, sh)}'">
      <div class="rank-main">
        <div class="rank-name">${escapeHtml(labelOf(r.k))}<span class="rank-id"> n\u00b0${String(r.e.species).padStart(3, "0")}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(r.count / max) * 100}%"></div></div>
      </div>
      <span class="rank-count">${r.count}</span>
    </div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ─── Événements ───
grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) voteFor(card.dataset.key);
});
searchInput.addEventListener("input", renderGrid);
genSelect.addEventListener("change", renderGrid);
shinyBtn.addEventListener("click", () => {
  shiny = !shiny;
  shinyBtn.classList.toggle("shiny-on", shiny);
  renderGrid();
});
$("tab-grid").addEventListener("click", () => switchTab("grid"));
$("tab-ranking").addEventListener("click", () => switchTab("ranking"));

function switchTab(t) {
  grid.classList.toggle("hidden", t !== "grid");
  ranking.classList.toggle("hidden", t !== "ranking");
  searchInput.classList.toggle("hidden", t !== "grid");
  genSelect.classList.toggle("hidden", t !== "grid");
  shinyBtn.classList.toggle("hidden", t !== "grid");
  $("tab-grid").classList.toggle("tab-on", t === "grid");
  $("tab-ranking").classList.toggle("tab-on", t === "ranking");
}

// ─── Init ───
for (let i = 1; i <= GENS.length; i++) {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = "G\u00e9n\u00e9ration " + i;
  genSelect.appendChild(opt);
}
const optF = document.createElement("option");
optF.value = "F";
optF.textContent = "M\u00e9ga & formes";
genSelect.appendChild(optF);
updateScreen();
renderGrid();
renderRanking();
</script>
