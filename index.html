<title>PokéVote — Vote pour ton Pokémon préféré</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #1b2030;
    color: #e9ecf4;
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, system-ui, sans-serif;
    padding-bottom: 48px;
  }
  /* ── Boîtier Pokédex ── */
  .dex {
    background: linear-gradient(180deg, #c9302b, #a02420);
    border-bottom: 6px solid #6e1714;
    padding: 20px 24px 24px;
    border-radius: 0 0 22px 22px;
    max-width: 860px;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .dex-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .lens {
    width: 44px; height: 44px; border-radius: 50%;
    background: #eef4ff; border: 3px solid #6e1714;
    display: grid; place-items: center;
  }
  .lens-inner {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9fd0ff, #2b6cb0 70%);
  }
  .leds { display: flex; gap: 8px; }
  .led { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
  h1 {
    font-size: 2.1rem; letter-spacing: .5px; color: #fff;
    text-shadow: 0 2px 0 #6e1714; margin-bottom: 4px;
  }
  .subtitle { color: #ffd9d7; font-size: .95rem; max-width: 520px; margin-bottom: 14px; }
  .screen {
    background: #1e2b1e; border: 3px solid #6e1714; border-radius: 10px;
    padding: 10px 14px; color: #9be89b;
    font-family: 'Courier New', monospace; font-size: .95rem;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.6);
  }
  .banner {
    margin-top: 8px; color: #fff; background: #6e1714;
    padding: 8px 12px; border-radius: 8px; font-size: .85rem;
  }
  .banner a { color: #f5c542; }
  /* ── Navigation ── */
  nav {
    max-width: 860px; margin: 18px auto 10px; padding: 0 16px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .tab {
    padding: 9px 18px; border-radius: 10px;
    border: 2px solid #39415a; background: #242b3f; color: #aeb6cf;
    font-weight: 700; font-size: .95rem; cursor: pointer; font-family: inherit;
  }
  .tab-on { background: #c9302b; border-color: #6e1714; color: #fff; }
  select, input[type="search"] {
    padding: 9px 12px; border-radius: 10px;
    border: 2px solid #39415a; background: #242b3f; color: #e9ecf4;
    font-size: .95rem; outline: none; font-family: inherit;
  }
  input[type="search"] { flex: 1; min-width: 180px; }
  .tab:focus-visible, .card:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid #f5c542; outline-offset: 2px;
  }
  /* ── Grille ── */
  #grid {
    max-width: 860px; margin: 0 auto; padding: 6px 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 10px;
  }
  .card {
    position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 10px 6px 12px; background: #242b3f;
    border: 2px solid #39415a; border-radius: 14px;
    cursor: pointer; color: inherit; font-family: inherit; text-align: center;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover:not(:disabled) { transform: translateY(-2px); border-color: #c9302b; }
  .card:disabled { opacity: .7; cursor: wait; }
  .card-mine { border-color: #f5c542; background: #2c3350; }
  .card .num { font-size: .72rem; color: #8b93ad; }
  .card img { width: 72px; height: 72px; image-rendering: pixelated; margin: 2px auto; }
  .card .name { font-weight: 700; font-size: .85rem; line-height: 1.15; color: #f2f4fa; }
  .card .count { font-size: .75rem; color: #aeb6cf; margin-top: 2px; }
  .badge {
    position: absolute; top: 6px; right: 6px;
    background: #f5c542; color: #4a3400;
    font-size: .62rem; font-weight: 700; padding: 2px 6px; border-radius: 999px;
  }
  .empty { grid-column: 1 / -1; text-align: center; color: #aeb6cf; padding: 30px 10px; }
  /* ── Classement ── */
  #ranking {
    max-width: 720px; margin: 0 auto; padding: 6px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .rank-row {
    display: flex; align-items: center; gap: 12px;
    background: #242b3f; border: 2px solid #39415a; border-radius: 14px;
    padding: 8px 14px 8px 8px;
  }
  .rank-row:first-child { border-color: #f5c542; }
  .rank-pos { width: 30px; text-align: center; font-weight: 800; font-size: 1.05rem; color: #f5c542; }
  .rank-row img { width: 52px; height: 52px; image-rendering: pixelated; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-id { font-weight: 400; color: #8b93ad; font-size: .8rem; }
  .bar-track { height: 8px; background: #1b2030; border-radius: 999px; margin-top: 5px; overflow: hidden; }
  .bar-fill {
    height: 100%; background: linear-gradient(90deg, #c9302b, #f5c542);
    border-radius: 999px; transition: width .4s ease;
  }
  .rank-count {
    font-weight: 800; min-width: 34px; text-align: right;
    color: #9be89b; font-family: 'Courier New', monospace;
  }
  footer { text-align: center; color: #69718c; font-size: .78rem; margin-top: 28px; padding: 0 16px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover, .bar-fill { transition: none; transform: none; }
  }
</style>
</head>

const configOk = firebaseConfig.apiKey && firebaseConfig.databaseURL;
if (configOk) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  db.ref("votes").on("value", snap => {
    votes = snap.val() || {};
    updateScreen();
    renderGrid();
    renderRanking();
  }, err => {
    showBanner("Impossible de lire les votes (vérifie les règles de la base). " + err.message);
  });
} else {
  showBanner("Configuration Firebase manquante : les votes sont désactivés. Ouvre index.html et remplis firebaseConfig (voir README.md).");
  updateScreen();
}

function showBanner(msg) {
  banner.textContent = msg;
  banner.classList.remove("hidden");
}

async function voteFor(id) {
  if (!db || saving || id === myVote) return;
  saving = true;
  renderGrid();
  try {
    const old = myVote;
    if (old != null) {
      await db.ref("votes/" + old).transaction(c => Math.max(0, (c || 0) - 1));
    }
    await db.ref("votes/" + id).transaction(c => (c || 0) + 1);
    myVote = id;
    localStorage.setItem("pokevote-my-vote", String(id));
  } catch (e) {
    showBanner("Le vote n'a pas pu être enregistré. Réessaie.");
  }
  saving = false;
  updateScreen();
  renderGrid();
  renderRanking();
}

// ─── Rendu ───
function totalVotes() {
  return Object.values(votes).reduce((a, b) => a + (b || 0), 0);
}

function updateScreen() {
  const t = totalVotes();
  const plural = t > 1 ? "s" : "";
  if (!configOk) {
    screen.textContent = "Mode hors ligne — votes désactivés";
  } else if (myVote) {
    screen.innerHTML = `Ton favori : <b>${POKEMON[myVote - 1].name}</b> · ${t} vote${plural} au total`;
  } else {
    screen.textContent = `Aucun vote enregistré — choisis ton favori ! (${t} vote${plural} au total)`;
  }
}

function currentFilter() {
  const q = searchInput.value.trim().toLowerCase();
  const gen = parseInt(genSelect.value, 10);
  return POKEMON.filter(p => {
    if (gen > 0 && genOf(p.id) !== gen) return false;
    if (!q) return true;
    return p.name.toLowerCase().includes(q) || String(p.id) === q.replace(/^0+/, "");
  });
}

function renderGrid() {
  const list = currentFilter();
  if (!list.length) {
    grid.innerHTML = `<p class="empty">Aucun Pokémon ne correspond à « ${escapeHtml(searchInput.value)} ». Vérifie l'orthographe ou essaie un numéro (1 à 1025).</p>`;
    return;
  }
  grid.innerHTML = list.map(p => {
    const c = votes[p.id] || 0;
    const mine = p.id === myVote;
    return `<button class="card${mine ? " card-mine" : ""}" data-id="${p.id}" ${saving ? "disabled" : ""}
      title="${mine ? "Ton favori actuel" : "Voter pour " + escapeHtml(p.name)}">
      <span class="num">n°${String(p.id).padStart(3, "0")}</span>
      <img src="${sprite(p.id)}" alt="${escapeHtml(p.name)}" loading="lazy"
           onerror="this.onerror=null;this.src='${artwork(p.id)}'">
      <span class="name">${escapeHtml(p.name)}</span>
      <span class="count">${c > 0 ? c + " vote" + (c > 1 ? "s" : "") : "—"}</span>
      ${mine ? '<span class="badge">Ton favori</span>' : ""}
    </button>`;
  }).join("");
}

function renderRanking() {
  const rows = POKEMON
    .map(p => ({ ...p, count: votes[p.id] || 0 }))
    .filter(p => p.count > 0)
    .sort((a, b) => b.count - a.count || a.id - b.id);
  if (!rows.length) {
    ranking.innerHTML = `<p class="empty">Personne n'a encore voté. Sois le premier — va dans l'onglet « Voter » !</p>`;
    return;
  }
  const max = rows[0].count;
  ranking.innerHTML = rows.map((p, i) => `
    <div class="rank-row">
      <span class="rank-pos">${i + 1}</span>
      <img src="${sprite(p.id)}" alt="" onerror="this.onerror=null;this.src='${artwork(p.id)}'">
      <div class="rank-main">
        <div class="rank-name">${escapeHtml(p.name)}<span class="rank-id"> n°${String(p.id).padStart(3, "0")}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(p.count / max) * 100}%"></div></div>
      </div>
      <span class="rank-count">${p.count}</span>
    </div>`).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ─── Événements ───
grid.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (card) voteFor(parseInt(card.dataset.id, 10));
});
searchInput.addEventListener("input", renderGrid);
genSelect.addEventListener("change", renderGrid);
$("tab-grid").addEventListener("click", () => switchTab("grid"));
$("tab-ranking").addEventListener("click", () => switchTab("ranking"));

function switchTab(t) {
  grid.classList.toggle("hidden", t !== "grid");
  ranking.classList.toggle("hidden", t !== "ranking");
  searchInput.classList.toggle("hidden", t !== "grid");
  genSelect.classList.toggle("hidden", t !== "grid");
  $("tab-grid").classList.toggle("tab-on", t === "grid");
  $("tab-ranking").classList.toggle("tab-on", t === "ranking");
}

// ─── Init ───
for (let i = 1; i <= GENS.length; i++) {
  const opt = document.createElement("option");
  opt.value = i;
  opt.textContent = "Génération " + i;
  genSelect.appendChild(opt);
}
updateScreen();
renderGrid();
renderRanking();
</script>
</body>
</html>
